name: agent-probes

# 公开 Agent CLI 的协议勘察：只跑 --version/--help/文档化握手，无凭据。
on:
  push:
    branches: [main]
    paths-ignore:
      - "results/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: "!startsWith(github.event.head_commit.message, 'results:')"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { agent: claude,     install: "npm install -g @anthropic-ai/claude-code" }
          - { agent: codex,      install: "npm install -g @openai/codex" }
          - { agent: gemini,     install: "npm install -g @google/gemini-cli" }
          - { agent: opencode,   install: "npm install -g opencode-ai" }
          - { agent: qwen,       install: "npm install -g @qwen-code/qwen-code" }
          - { agent: copilot,    install: "npm install -g @github/copilot" }
          - { agent: auggie,     install: "npm install -g @augmentcode/auggie" }
          - { agent: crush,      install: "npm install -g @charmland/crush" }
          # 国产 / 非国产补充（官方安装命令；无凭证级探测）
          - { agent: codebuddy,  install: "npm install -g @tencent-ai/codebuddy-code" }
          - { agent: qoder-cn,   install: "curl -fsSL https://qoder.com.cn/install | bash" }
          - { agent: kimi,       install: "curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash" }
          - { agent: openclaw,   install: "npm install -g openclaw" }
          - { agent: fx,         install: "curl -fsSL https://fx.sh/setup.sh | bash" }
          - { agent: trae,       install: "sh -c \"$(curl -fsSL https://trae.cn/trae-cli/install_v2.sh)\"" }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 使用镜像 registry（加速安装，不改包源内容）
        run: npm config set registry https://registry.npmmirror.com
      - name: 脚本语法检查（避免静默失败）
        run: node --check scripts/probe.mjs && node --check scripts/merge.mjs
      - name: 安装 ${{ matrix.agent }}
        continue-on-error: true
        run: ${{ matrix.install }}
      - name: 勘察 ${{ matrix.agent }}
        continue-on-error: true
        run: node scripts/probe.mjs "${{ matrix.agent }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.agent }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14

  collect:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: probe-*
          path: out
          merge-multiple: true
      - name: 合并结果
        run: node scripts/merge.mjs
      - name: 提交结果回仓库（失败不影响勘察，artifacts 已上传）
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out results
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "results: agent protocol probe $(date -u +%FT%TZ)"
            git push
          fi
